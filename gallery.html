<!DOCTYPE html>
<html lang="tr">
<head>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    .gallery-img {
      cursor: pointer;
      transition: transform 0.3s ease;
      height: 250px;
      object-fit: cover;
      width: 100%;
    }

    .gallery-img:hover {
      transform: scale(1.05);
    }

    footer {
      background-color: #f8f9fa;
      padding: 20px 0;
      margin-top: 50px;
    }
  </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="#">Blog Sitesi</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link" href="#">Ana Sayfa</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Hakkımızda</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Hizmetler</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Ürünler</a></li>
        <li class="nav-item"><a class="nav-link" href="#">SSS</a></li>
        <li class="nav-item"><a class="nav-link" href="#">İletişim</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Kayıt Ol</a></li>
        <li class="nav-item"><a class="nav-link " href="#">Blog</a></li>
        <li class="nav-item"><a class="nav-link active" href="#">Galeri</a></li>
      </ul>
    </div>
  </div>
</nav>

<!-- Galeri Bölümü -->
<div class="container py-5">
  <h2 class="text-center mb-4">Galeri</h2>
  <div class="row g-3">
    <!-- 6 Resim -->
    <div class="col-md-4 col-sm-6">
      <img src="img/img1.jpg" alt="" class="gallery-img"
           data-bs-toggle="modal" data-bs-target="#imageModal"
           data-bs-img="https://via.placeholder.com/1200x800?text=1"
           data-bs-desc="Lorem ipsum dolor sit amet, consectetur adipiscing elit. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur.">
    </div>
    <div class="col-md-4 col-sm-6">
      <img src="img/img2.jpg" alt="" class="gallery-img"
           data-bs-toggle="modal" data-bs-target="#imageModal"
           data-bs-img="https://via.placeholder.com/1200x800?text=2"
           data-bs-desc="Lorem ipsum dolor sit amet, consectetur adipiscing elit. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur.">
    </div>
    <div class="col-md-4 col-sm-6">
      <img src="img/img3.jpg" alt="" class="gallery-img"
           data-bs-toggle="modal" data-bs-target="#imageModal"
           data-bs-img="https://via.placeholder.com/1200x800?text=3"

    </div>
    <div class="col-md-4 col-sm-6">

           data-bs-img="https://via.placeholder.com/1200x800?text=4"

    </div>
    <div class="col-md-4 col-sm-6">
      <img src="img/img5.jpg" alt="" class="gallery-img"
           data-bs-toggle="modal" data-bs-target="#imageModal"
           data-bs-img="https://via.placeholder.com/1200x800?text=5"

  </div>

<!-- Modal -->
<div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered modal-xl">
    <div class="modal-content bg-dark text-white">
      <div class="modal-body p-0">
        <img src="" alt="" id="modalImage" class="img-fluid w-100">
        <div class="p-4" id="modalDescription"></div>
      </div>
    </div>
  </div>
</div>

<!-- Footer -->
<footer class="text-center bg-dark text-white">
  <div class="container">
    <p>&copy; 2025 Blog Sitesi. Tüm hakları saklıdır.</p>
    <p>Designed by Asuman</p>
  </div>
</footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const galleryImages = document.querySelectorAll('.gallery-img');
  const modalImage = document.getElementById('modalImage');
  const modalDescription = document.getElementById('modalDescription');

  galleryImages.forEach(img => {
    img.addEventListener('click', () => {
      const imgSrc = img.getAttribute('data-bs-img');
      const desc = img.getAttribute('data-bs-desc');
      modalImage.src = imgSrc;
      modalDescription.textContent = desc;
    });
  });
</script>

</body>
</html>
